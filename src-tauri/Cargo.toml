[package]
name = "shipyardx"
version = "0.1.0"
description = "A Tauri App"
authors = ["MisakaTAT"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shipyardx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.50.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "io-util", "net", "sync", "process"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
uuid = { version = "1.23.0", features = ["v4"] }
network-interface = { version = "2.0.5", features = ["serde"] }
specta = { version = "2.0.0-rc.24", features = ["derive", "function"] }
specta-typescript = "0.0.11"
tauri-specta = { version = "2.0.0-rc.24", features = ["derive", "javascript", "typescript"] }
serde_yaml = "0.9"
chrono = "0.4"
font-kit = "0.14"
