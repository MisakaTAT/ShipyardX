name: Cross Platform Cargo Check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  cargo-check:
    name: Cargo check (${{ matrix.bundle_name }})
    # Treat all Rust compiler warnings as errors
    env:
      RUSTFLAGS: '-D warnings'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_name: Windows x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle_name: macOS Apple Silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle_name: macOS Intel
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_name: Linux x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: yarn

      - name: Install frontend dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --target ${{ matrix.target }} --workspace --all-features
