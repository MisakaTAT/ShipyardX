name: ShipyardX Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 手动预览构建时要检出的分支、tag 或 commit，留空则使用当前提交
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('preview-{0}', inputs.ref || github.sha) || github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_body: ${{ steps.release.outputs.release_body }}
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release mode and metadata
        id: release
        shell: bash
        run: |
          SHOULD_PUBLISH=true
          RELEASE_TAG="${GITHUB_REF_NAME}"
          CHECKOUT_REF="${GITHUB_REF_NAME}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            SHOULD_PUBLISH=false
            RELEASE_TAG="preview-${GITHUB_RUN_NUMBER}"
            CHECKOUT_REF="${{ inputs.ref }}"

            if [[ -z "$CHECKOUT_REF" ]]; then
              CHECKOUT_REF="${GITHUB_SHA}"
            fi
          fi

          if [[ "$SHOULD_PUBLISH" == "true" && -z "$RELEASE_TAG" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          if [[ "$SHOULD_PUBLISH" == "true" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag format: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$SHOULD_PUBLISH" != "true" ]]; then
            RELEASE_VERSION="preview-${GITHUB_SHA::7}"
          else
            RELEASE_VERSION="${RELEASE_TAG#v}"
          fi

          PRERELEASE=false
          if [[ "$SHOULD_PUBLISH" != "true" || "$RELEASE_VERSION" == *-* ]]; then
            PRERELEASE=true
          fi

          RELEASE_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          {
            echo "release_body<<EOF"
            cat <<EOF
          ## ShipyardX release

          - Release date: ${RELEASE_DATE}
          - Version: ${RELEASE_VERSION}
          - Trigger: tag push
          - Supported bundles:
            - Windows x64
            - Windows ARM64
            - macOS ARM64
            - macOS x64
            - Linux x64
            - Linux ARM64
            - Linux ARMv7
          - Auto update assets:
            - 发布时会同步更新 \`latest.json\`
            - 工作流结束前会检查 updater 签名产物是否齐全
          EOF
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release tag exists
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/${{ steps.release.outputs.release_tag }}"

      - name: Create or update GitHub Release
        if: steps.release.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: ShipyardX ${{ steps.release.outputs.release_tag }}
          body: ${{ steps.release.outputs.release_body }}
          draft: false
          prerelease: ${{ fromJSON(steps.release.outputs.prerelease) }}

  verify:
    name: Verify project
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Validate release version
        if: needs.prepare-release.outputs.should_publish == 'true'
        run: |
          TAG="${{ needs.prepare-release.outputs.release_version }}"

          PACKAGE_VERSION="$(ruby -rjson -e 'puts JSON.parse(File.read("package.json"))["version"]')"
          CARGO_VERSION="$(ruby -e 'text=File.read("src-tauri/Cargo.toml"); puts text.lines.grep(/^version = "/).first.to_s[/\"(.*)\"/, 1]' )"
          TAURI_VERSION="$(ruby -rjson -e 'puts JSON.parse(File.read("src-tauri/tauri.conf.json"))["version"]')"

          echo "tag version:      $TAG"
          echo "package version:  $PACKAGE_VERSION"
          echo "cargo version:    $CARGO_VERSION"
          echo "tauri version:    $TAURI_VERSION"

          test "$TAG" = "$PACKAGE_VERSION"
          test "$TAG" = "$CARGO_VERSION"
          test "$TAG" = "$TAURI_VERSION"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: |
          pnpm typecheck
          pnpm test

      - name: Run Rust checks
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked

  release-standard:
    name: Build ${{ matrix.bundle_name }}
    needs: [prepare-release, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_name: Windows x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle_name: Windows ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle_name: macOS ARM64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle_name: macOS x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_name: Linux x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          save-if: ${{ needs.prepare-release.outputs.should_publish == 'true' }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build and publish release assets
        if: needs.prepare-release.outputs.should_publish == 'true'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare-release.outputs.release_tag }}
          releaseName: ShipyardX ${{ needs.prepare-release.outputs.release_tag }}
          releaseBody: ${{ needs.prepare-release.outputs.release_body }}
          releaseDraft: false
          prerelease: ${{ fromJSON(needs.prepare-release.outputs.prerelease) }}
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          retryAttempts: 3

      - name: Build preview bundles
        if: needs.prepare-release.outputs.should_publish != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload preview artifacts
        if: needs.prepare-release.outputs.should_publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            src-tauri/target/${{ matrix.target }}/release/*.sig
          if-no-files-found: error

  release-linux-arm:
    name: Build Linux ${{ matrix.bundle_name }}
    needs: [prepare-release, verify]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            bundle_name: ARM64
            asset_pattern: "arm64|aarch64"
          - arch: armhf
            target: armv7-unknown-linux-gnueabihf
            bundle_name: ARMv7
            asset_pattern: "armhf|armv7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Setup Linux multiarch dependencies
        run: |
          sudo ls -lR /etc/apt/

          cat > /tmp/sources.list << 'EOF'
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted

          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF

          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev:${{ matrix.arch }} \
            libgtk-3-dev:${{ matrix.arch }} \
            libayatana-appindicator3-dev:${{ matrix.arch }} \
            libssl-dev:${{ matrix.arch }} \
            patchelf:${{ matrix.arch }} \
            librsvg2-dev:${{ matrix.arch }}

      - name: Install aarch64 tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Install armv7 tools
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Add Rust target
        run: |
          rustup target add ${{ matrix.target }}
          rustup target list --installed

      - name: Build Linux ARM bundles
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export PKG_CONFIG_ALLOW_CROSS=1

          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
            export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          else
            export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig:$PKG_CONFIG_PATH
            export PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf/
            export CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc
            export CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++
            export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
          fi

          pnpm tauri build --target ${{ matrix.target }}

      - name: Collect Linux ARM build assets
        shell: bash
        run: |
          mkdir -p release-assets

          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sig' \) \
            -exec cp {} release-assets/ \;

          find src-tauri/target/${{ matrix.target }}/release -maxdepth 1 -type f \
            -name '*.sig' -exec cp {} release-assets/ \;

          ls -la release-assets

          find release-assets -maxdepth 1 -type f | grep -Eq '\.(AppImage|deb|rpm)$'
          find release-assets -maxdepth 1 -type f | grep -Eq '\.sig$'
          find release-assets -maxdepth 1 -type f | grep -Eiq "${{ matrix.asset_pattern }}"

      - name: Upload Linux ARM assets to release
        if: needs.prepare-release.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.release_tag }}" release-assets/* --clobber

      - name: Upload Linux ARM preview artifacts
        if: needs.prepare-release.outputs.should_publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-linux-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  verify-release-assets:
    name: Verify published release assets
    needs: [prepare-release, release-standard, release-linux-arm]
    if: needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Audit GitHub Release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | tee assets.txt

          grep -Eq '(\.msi$|setup\.exe$|\.exe$)' assets.txt
          grep -Eq '\.dmg$' assets.txt
          grep -Eq '(\.AppImage$|_amd64\.deb$|x86_64\.rpm$)' assets.txt
          grep -Eiq '(arm64|aarch64).*(\.AppImage|\.deb|\.rpm)$' assets.txt
          grep -Eiq '(armhf|armv7).*(\.AppImage|\.deb|\.rpm)$' assets.txt
          grep -Eq 'latest.*\.json$' assets.txt
          grep -Eq '\.sig$' assets.txt
