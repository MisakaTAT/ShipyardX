name: ShipyardX Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 手动预览构建时要检出的分支、tag 或 commit，留空则使用当前提交
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('preview-{0}', inputs.ref || github.sha) || github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release mode and metadata
        id: release
        shell: bash
        run: |
          SHOULD_PUBLISH=true
          RELEASE_TAG="${GITHUB_REF_NAME}"
          CHECKOUT_REF="${GITHUB_REF_NAME}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            SHOULD_PUBLISH=false
            RELEASE_TAG="preview-${GITHUB_RUN_NUMBER}"
            CHECKOUT_REF="${{ inputs.ref }}"

            if [[ -z "$CHECKOUT_REF" ]]; then
              CHECKOUT_REF="${GITHUB_SHA}"
            fi
          fi

          if [[ "$SHOULD_PUBLISH" == "true" && -z "$RELEASE_TAG" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          if [[ "$SHOULD_PUBLISH" == "true" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag format: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$SHOULD_PUBLISH" != "true" ]]; then
            RELEASE_VERSION="preview-${GITHUB_SHA::7}"
          else
            RELEASE_VERSION="${RELEASE_TAG#v}"
          fi

          PRERELEASE=false
          if [[ "$SHOULD_PUBLISH" != "true" || "$RELEASE_VERSION" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify release tag exists
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/${{ steps.release.outputs.release_tag }}"

  verify:
    name: Verify project
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Validate release version
        if: needs.prepare-release.outputs.should_publish == 'true'
        run: |
          TAG="${{ needs.prepare-release.outputs.release_version }}"

          PACKAGE_VERSION="$(ruby -rjson -e 'puts JSON.parse(File.read("package.json"))["version"]')"
          CARGO_VERSION="$(ruby -e 'text=File.read("src-tauri/Cargo.toml"); puts text.lines.grep(/^version = "/).first.to_s[/\"(.*)\"/, 1]' )"
          TAURI_VERSION="$(ruby -rjson -e 'puts JSON.parse(File.read("src-tauri/tauri.conf.json"))["version"]')"

          echo "tag version:      $TAG"
          echo "package version:  $PACKAGE_VERSION"
          echo "cargo version:    $CARGO_VERSION"
          echo "tauri version:    $TAURI_VERSION"

          test "$TAG" = "$PACKAGE_VERSION"
          test "$TAG" = "$CARGO_VERSION"
          test "$TAG" = "$TAURI_VERSION"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: |
          pnpm typecheck
          pnpm check:i18n
          pnpm test

      - name: Run Rust checks
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked

  release-standard:
    name: Build ${{ matrix.bundle_name }}
    needs: [prepare-release, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_name: Windows x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle_name: Windows ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle_name: macOS ARM64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle_name: macOS x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_name: Linux x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          save-if: ${{ needs.prepare-release.outputs.should_publish == 'true' }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build and publish release assets
        if: needs.prepare-release.outputs.should_publish == 'true'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare-release.outputs.release_tag }}
          releaseName: ShipyardX ${{ needs.prepare-release.outputs.release_tag }}
          releaseDraft: false
          prerelease: ${{ fromJSON(needs.prepare-release.outputs.prerelease) }}
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          retryAttempts: 3

      - name: Build preview bundles
        if: needs.prepare-release.outputs.should_publish != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload preview artifacts
        if: needs.prepare-release.outputs.should_publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            src-tauri/target/${{ matrix.target }}/release/*.sig
          if-no-files-found: error

  release-linux-arm64:
    name: Build Linux ARM64
    needs: [prepare-release, verify]
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            librsvg2-dev \
            libfuse2 \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Add Rust target
        run: |
          rustup target add aarch64-unknown-linux-gnu
          rustup target list --installed

      - name: Build Linux ARM bundles
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target aarch64-unknown-linux-gnu

      - name: Collect Linux ARM64 build assets
        shell: bash
        run: |
          mkdir -p release-assets

          find src-tauri/target/aarch64-unknown-linux-gnu/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sig' \) \
            -exec cp {} release-assets/ \;

          find src-tauri/target/aarch64-unknown-linux-gnu/release -maxdepth 1 -type f \
            -name '*.sig' -exec cp {} release-assets/ \;

          ls -la release-assets

          find release-assets -maxdepth 1 -type f | grep -Eq '\.(AppImage|deb|rpm)$'
          find release-assets -maxdepth 1 -type f | grep -Eq '\.sig$'
          find release-assets -maxdepth 1 -type f | grep -Eiq '(arm64|aarch64)'

      - name: Upload Linux ARM assets to release
        if: needs.prepare-release.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.release_tag }}" release-assets/* --clobber

      - name: Upload Linux ARM preview artifacts
        if: needs.prepare-release.outputs.should_publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-linux-arm64
          path: release-assets/*
          if-no-files-found: error

  verify-release-assets:
    name: Verify published release assets
    needs: [prepare-release, release-standard, release-linux-arm64]
    if: needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Audit GitHub Release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' | tee assets.txt

          grep -Eq 'setup\.exe$' assets.txt
          grep -Eq '\.dmg$' assets.txt
          grep -Eq '(\.app$|\.app\.tar\.gz$)' assets.txt
          grep -Eq '(\.AppImage$|_amd64\.deb$|x86_64\.rpm$)' assets.txt
          grep -Eiq '(arm64|aarch64).*(\.AppImage|\.deb|\.rpm)$' assets.txt
          grep -Eq 'latest.*\.json$' assets.txt
          grep -Eq '\.sig$' assets.txt
